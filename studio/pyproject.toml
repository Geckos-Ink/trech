[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trech-studio"
version = "0.1.0"
description = "Real-time 3D scenario editor, simulation viewer, and code editor for TRECH"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "TRECH" }]
dependencies = [
  "numpy>=1.24",
  "PySide6>=6.6",
  # wgpu-py: WebGPU -> Vulkan (Linux/Windows) / Metal (macOS) via naga.
  "wgpu>=0.15",
]

[project.optional-dependencies]
# Nothing heavier than the core three without a ROADMAP justification.
dev = ["ruff>=0.4"]

[project.scripts]
trech-studio = "trech_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trech_studio*"]

[tool.setuptools.package-data]
trech_studio = ["render/shaders/*.wgsl"]
